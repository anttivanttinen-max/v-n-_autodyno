<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:28px;font-weight:bold}.t{font-size:18px}.s{font-size:15px}.box{fill:#f8f9f9;stroke:#263238;stroke-width:2}.hot{fill:#ffe5e5;stroke:#b71c1c;stroke-width:2}.ok{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2}.line{stroke:#1565c0;stroke-width:4;fill:none}</style>
<text x="40" y="48" class="h">RPM-BT asennus pyörään</text>
<rect x="40" y="85" width="500" height="250" rx="18" class="hot"/><text x="70" y="125" class="t">Kuuma / sähköisesti häiriöinen alue</text><rect x="95" y="165" width="160" height="110" class="box"/><text x="120" y="225" class="t">Sylinteri</text><path d="M255 190 C330 140 390 145 470 190" class="line"/><text x="305" y="135" class="s">eristetty tulpanjohto</text><path d="M350 170 q12 22 24 0 q12 22 24 0 q12 22 24 0" stroke="#333" stroke-width="3" fill="none"/><text x="315" y="250" class="s">pickup 3 kierrosta aluksi</text><text x="70" y="307" class="s">Ei elektroniikkakoteloa, virtajohtoa tai BT-antennia tähän.</text>
<rect x="650" y="85" width="500" height="250" rx="18" class="ok"/><text x="680" y="125" class="t">Viileä runkopaikka</text><rect x="750" y="165" width="290" height="110" rx="12" class="box"/><text x="790" y="210" class="t">ESP32 + suojapiiri</text><text x="790" y="240" class="s">antenni muovia vasten, irti metallista</text><path d="M540 260 C600 320 630 225 650 220" class="line"/><text x="555" y="330" class="s">kierretty pari + vedonpoisto</text>
<rect x="40" y="395" width="1110" height="250" rx="18" class="box"/><text x="70" y="435" class="t">Erillinen kontaktiaudioreferenssi (ei kytketä ESP32 GPIO:hon)</text><rect x="110" y="500" width="180" height="75" class="box"/><text x="145" y="545" class="t">Kansipultti</text><rect x="290" y="485" width="170" height="105" class="ok"/><text x="315" y="530" class="t">Jatkomutteri</text><text x="315" y="558" class="s">vahvistettu geometria</text><rect x="460" y="500" width="210" height="75" class="box"/><text x="485" y="530" class="t">Alumiinishimmi</text><text x="485" y="555" class="s">tiukka esijännitys</text><rect x="670" y="485" width="230" height="105" rx="45" class="ok"/><text x="705" y="530" class="t">BT-kuuloke /</text><text x="705" y="557" class="t">kontaktitransducer</text><path d="M900 535 H1080" stroke="#b71c1c" stroke-width="4"/><text x="920" y="515" class="s">turvanaru runkoon</text><text x="70" y="620" class="s">Pidä poissa kuumasta; älä sekoita vanhoihin ilman jatkomutteria tehtyihin testeihin.</text>
</svg>
