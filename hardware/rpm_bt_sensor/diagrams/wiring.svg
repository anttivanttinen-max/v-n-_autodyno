<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<style>text{font:15px Arial;fill:#111}.w{stroke:#111;stroke-width:3;fill:none}.c{fill:#fff;stroke:#b3261e;stroke-width:2}.rail{stroke:#1769aa;stroke-width:3}.small{font-size:12px;fill:#555}</style>
<text x="30" y="35">RPM-BT V1 – pinni-pinniltä (tarkista U2/D1 valmistajakohtainen kotelopinout)</text>
<rect class="c" x="30" y="100" width="140" height="100"/><text x="100" y="135" text-anchor="middle">J1</text><text x="100" y="160" text-anchor="middle">1 PICKUP</text><text x="100" y="184" text-anchor="middle">2 RETURN</text>
<path class="w" d="M170 155H230"/><rect class="c" x="230" y="135" width="110" height="40"/><text x="285" y="160" text-anchor="middle">R1 100k</text><path class="w" d="M340 155H420"/><circle cx="420" cy="155" r="5" fill="#111"/><text x="420" y="130" text-anchor="middle">CLAMP</text>
<rect class="c" x="380" y="230" width="80" height="55"/><text x="420" y="252" text-anchor="middle">D2</text><text x="420" y="272" text-anchor="middle">SMBJ5CA</text><path class="w" d="M420 160V230M420 285V400"/>
<rect class="c" x="480" y="95" width="130" height="120"/><text x="545" y="120" text-anchor="middle">D1 BAV99</text><text x="545" y="145" text-anchor="middle">GND → CLAMP</text><text x="545" y="170" text-anchor="middle">CLAMP → 3V3</text><path class="w" d="M420 155H480M545 95V65M545 215V400"/>
<path class="w" d="M610 155H650"/><rect class="c" x="650" y="135" width="100" height="40"/><text x="700" y="160" text-anchor="middle">R2 10k</text><path class="w" d="M750 155H800"/><circle cx="800" cy="155" r="5" fill="#111"/><text x="800" y="130" text-anchor="middle">FILTER</text>
<rect class="c" x="770" y="230" width="60" height="45"/><text x="800" y="258" text-anchor="middle">C1 1n</text><path class="w" d="M800 160V230M800 275V400"/><rect class="c" x="850" y="230" width="70" height="45"/><text x="885" y="258" text-anchor="middle">R3 1M</text><path class="w" d="M800 190H885V230M885 275V400"/>
<rect class="c" x="930" y="100" width="120" height="115"/><text x="990" y="125" text-anchor="middle">U2</text><text x="990" y="150" text-anchor="middle">74LVC1G17</text><text x="990" y="175" text-anchor="middle">A=FILTER</text><text x="990" y="198" text-anchor="middle">VCC=3V3</text><path class="w" d="M800 155H930M1050 155H1080"/><rect class="c" x="1080" y="135" width="90" height="40"/><text x="1125" y="160" text-anchor="middle">R4 100R</text><text x="1125" y="205" text-anchor="middle">→ GPIO4</text>
<path class="rail" d="M200 65H1080"/><text x="190" y="70" text-anchor="end">3V3</text><path class="rail" d="M100 400H1080"/><text x="90" y="405" text-anchor="end">GND</text><path class="w" d="M170 180H190V400M990 100V65M990 215V400"/>
<text class="small" x="600" y="470" text-anchor="middle">C2 100 nF + C3 10 µF U2 VCC–GND, C2 aivan U2:n vieressä. Kaapelisuoja vain kotelon GND:hen.</text></svg>

