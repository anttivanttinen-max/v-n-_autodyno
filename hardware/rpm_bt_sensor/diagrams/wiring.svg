<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:28px;font-weight:bold}.t{font-size:18px}.s{font-size:15px}.box{fill:#f8f9f9;stroke:#263238;stroke-width:2}.warn{fill:#fff3cd;stroke:#c77d00;stroke-width:2}.line{stroke:#1565c0;stroke-width:4;fill:none}.g{stroke:#333;stroke-width:3}</style>
<text x="40" y="48" class="h">VÄNÄ RPM-BT v1 — suojattu induktiivinen tulo</text>
<rect x="35" y="90" width="240" height="180" rx="14" class="box"/><text x="60" y="125" class="t">Tulpanjohto (eristetty)</text><path d="M65 175 H245" class="line"/><path d="M105 150 q15 25 30 0 q15 25 30 0 q15 25 30 0" class="g" fill="none"/><text x="60" y="225" class="s">Pickup 1–8 kierrosta</text><text x="60" y="247" class="s">aloita 3 kierroksella</text>
<rect x="330" y="80" width="490" height="350" rx="14" class="box"/><text x="355" y="118" class="t">3.3 V suojapiiri koekytkentälevyllä</text><text x="355" y="165" class="t">PICKUP+ → C1 1 nF/100 V → R1 100 kΩ → SENSE</text><text x="355" y="205" class="t">PICKUP− → paikallinen GND</text><text x="355" y="245" class="t">SENSE → R2 10 kΩ → GND</text><text x="355" y="285" class="t">SENSE → BAT54S clamp → 0 V / 3.3 V</text><text x="355" y="325" class="t">SENSE → 3.3 V Schmitt → R4 1 kΩ → OUT</text><text x="355" y="365" class="t">IC VCC 3.3 V; 100 nF suoraan VCC–GND</text><path d="M275 180 H330" class="line"/>
<rect x="880" y="80" width="280" height="350" rx="14" class="box"/><text x="905" y="118" class="t">ESP32-S3 N16R8</text><text x="905" y="165" class="t">GPIO4 ← OUT</text><text x="905" y="205" class="t">3V3 → suojapiiri</text><text x="905" y="245" class="t">GND → suojapiiri</text><text x="905" y="285" class="t">GPIO48 → 1 kΩ → LED</text><text x="905" y="325" class="t">GPIO0 → painike → GND</text><text x="905" y="365" class="t">USB: flash/debug/bench</text><path d="M820 250 H880" class="line"/>
<rect x="35" y="485" width="1125" height="150" rx="14" class="warn"/><text x="60" y="525" class="t">VAROITUS</text><text x="60" y="563" class="t">Älä yhdistä CDI:tä, puolan ensiötä/miinusta, tulpanjohtoa tai ajoneuvon jännitettä suoraan ESP32:een.</text><text x="60" y="600" class="t">Pickup on vain eristetyn tulpanjohdon ympärille kierretty johdin. Varmista kortin tarkka pinout silkkipainatuksesta.</text>
</svg>

