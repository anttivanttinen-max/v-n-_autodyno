<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<style>.bg{fill:#f7f4ea}.rail{stroke-width:8}.r{stroke:#d32f2f}.b{stroke:#1565c0}.wire{fill:none;stroke-width:5}.g{stroke:#263238}.o{stroke:#ef6c00}.p{stroke:#8e24aa}.hole{fill:#ddd;stroke:#aaa}.ic{fill:#263238;stroke:#000;stroke-width:3}.part{fill:#fff;stroke:#333;stroke-width:3}.txt{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:30px;font-weight:bold}.t{font-size:20px}.s{font-size:16px}.pin{fill:#eee;stroke:#222}.sense{fill:#fff59d;stroke:#f9a825;stroke-width:4}</style>
<rect width="1600" height="980" fill="white"/><text x="45" y="48" class="txt h">Koekytkentälevy — RPM-BT suojatulo, 74HC14 DIP-14</text><text x="45" y="78" class="txt s">Näkymä ylhäältä. Lovi ylöspäin. Rivit ovat havainnollisia: seuraa sähköisiä solmuja ja jalkojen numeroita.</text>
<rect x="60" y="110" width="1480" height="700" rx="25" class="bg" stroke="#777" stroke-width="3"/>
<line x1="110" y1="155" x2="1490" y2="155" class="rail r"/><line x1="110" y1="190" x2="1490" y2="190" class="rail b"/><text x="72" y="162" class="txt t" fill="#d32f2f">3V3</text><text x="72" y="198" class="txt t" fill="#1565c0">GND</text>
<line x1="110" y1="735" x2="1490" y2="735" class="rail r"/><line x1="110" y1="770" x2="1490" y2="770" class="rail b"/>
<rect x="640" y="315" width="320" height="300" rx="25" class="ic"/><path d="M770 315 q30 45 60 0" fill="white"/><text x="735" y="455" class="txt t" fill="white">74HC14N</text><text x="728" y="485" class="txt s" fill="white">DIP-14</text>
<g class="txt s"><!-- left pins 1..7 --><text x="600" y="350">1</text><text x="600" y="390">2</text><text x="600" y="430">3</text><text x="600" y="470">4</text><text x="600" y="510">5</text><text x="600" y="550">6</text><text x="600" y="590">7 GND</text><!-- right 14..8 --><text x="975" y="350">14 VCC</text><text x="975" y="390">13</text><text x="975" y="430">12</text><text x="975" y="470">11</text><text x="975" y="510">10</text><text x="975" y="550">9</text><text x="975" y="590">8</text></g>
<g fill="#bbb" stroke="#222"><rect x="620" y="335" width="40" height="14"/><rect x="620" y="375" width="40" height="14"/><rect x="620" y="415" width="40" height="14"/><rect x="620" y="455" width="40" height="14"/><rect x="620" y="495" width="40" height="14"/><rect x="620" y="535" width="40" height="14"/><rect x="620" y="575" width="40" height="14"/><rect x="940" y="335" width="40" height="14"/><rect x="940" y="375" width="40" height="14"/><rect x="940" y="415" width="40" height="14"/><rect x="940" y="455" width="40" height="14"/><rect x="940" y="495" width="40" height="14"/><rect x="940" y="535" width="40" height="14"/><rect x="940" y="575" width="40" height="14"/></g>
<rect x="95" y="330" width="150" height="150" rx="12" class="part"/><text x="120" y="370" class="txt t">J1 PICKUP</text><text x="120" y="410" class="txt s">1: PICKUP+</text><text x="120" y="445" class="txt s">2: PICKUP−</text>
<rect x="300" y="330" width="95" height="55" rx="12" class="part"/><text x="317" y="363" class="txt s">C1 1 nF</text><rect x="435" y="330" width="120" height="55" rx="12" class="part"/><text x="450" y="363" class="txt s">R1 100 kΩ</text>
<path d="M245 360 H300 M395 358 H435 M555 358 H620" class="wire o"/><circle cx="580" cy="358" r="18" class="sense"/><text x="535" y="305" class="txt s">SENSE</text>
<rect x="485" y="455" width="115" height="55" rx="12" class="part"/><text x="500" y="488" class="txt s">R2 10 kΩ</text><path d="M580 375 V455 M540 510 V770" class="wire b"/>
<rect x="380" y="555" width="160" height="90" rx="12" class="part"/><text x="400" y="587" class="txt s">BAT54S</text><text x="400" y="614" class="txt s">SOT-23/breakout</text><text x="400" y="638" class="txt s">1=GND 2=SENSE 3=3V3</text><path d="M460 555 V358 H580 M405 645 V770 M515 645 V155" class="wire p"/>
<path d="M245 445 H270 V770" class="wire b"/><path d="M980 342 H1080 V155" class="wire r"/><path d="M620 582 H570 V770" class="wire b"/>
<rect x="1050" y="315" width="140" height="55" rx="12" class="part"/><text x="1070" y="348" class="txt s">100 nF</text><path d="M1080 370 V770 M1150 370 V155" class="wire g"/><text x="1050" y="405" class="txt s">mahdollisimman lähelle pin 14/7</text>
<rect x="1100" y="475" width="120" height="55" rx="12" class="part"/><text x="1120" y="508" class="txt s">R4 1 kΩ</text><path d="M620 382 H590 V502 H1100 M1220 502 H1300" class="wire o"/>
<rect x="1300" y="440" width="185" height="130" rx="12" class="part"/><text x="1320" y="475" class="txt t">J2 ESP32</text><text x="1320" y="510" class="txt s">OUT → GPIO4</text><text x="1320" y="538" class="txt s">3V3 → 3V3</text><text x="1320" y="564" class="txt s">GND → GND</text><path d="M1390 440 V155 M1440 570 V770" class="wire r"/>
<path d="M620 422 H580 V680 H1020 V770 M620 502 H560 V700 H1040 V770 M980 382 H1020 V680 M980 462 H1040 V700 M980 542 H1060 V770" class="wire b"/><text x="650" y="690" class="txt s">Käyttämättömät tulot 3,5,9,11,13 → GND. Lähdöt 4,6,8,10,12 auki.</text>
<rect x="60" y="845" width="1480" height="90" rx="14" fill="#fff3cd" stroke="#c77d00" stroke-width="3"/><text x="90" y="882" class="txt t">Tarkista ennen virtaa: 74HC14 pin 14=3V3, pin 7=GND; BAT54S 1=GND, 2=SENSE, 3=3V3.</text><text x="90" y="915" class="txt t">Pickup kiertyy vain eristetyn tulpanjohdon ympärille — ei sähköistä yhteyttä sytytysjärjestelmään.</text>
</svg>

