name: Apply full-trip research build
on:
  push:
    branches: [agent/v32-full-trip-audio-research]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v32-full-trip-audio-research
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply research patch
        run: node scripts/patch_trip_research.js
      - name: Validate syntax and markers
        run: |
          node --check trip_research.js
          node --check sw.js
          node --check scripts/patch_trip_research.js
          grep -q 'motolab-audio-candidates' index.html
          grep -q 'candidates:r.candidates' index.html
          grep -q 'trip_research.js' sw.js
          grep -q '2026-08-16k' version.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,re.S|re.I)
          for script in scripts:
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
                  f.write(script); name=f.name
              subprocess.run(['node','--check',name],check=True)
          print('inline JS OK')
          PY
      - name: Commit generated files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js version.js
          git commit -m 'MotoLab v32.4: enable full-trip GPS audio research logging'
          git push origin HEAD:agent/v32-full-trip-audio-research
