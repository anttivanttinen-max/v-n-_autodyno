name: Apply compact UI build patch
on:
  push:
    branches: [agent/mic-learning-window-20pct]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mic-learning-window-20pct
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/patch_ui_build.js
      - run: |
          node --check ui_compact.js
          node --check sw.js
          grep -q 'version.js?build=2026-08-16i' index.html
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Align compact UI build in app shell'
          git push origin HEAD:agent/mic-learning-window-20pct
