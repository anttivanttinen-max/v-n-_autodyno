name: Apply continuous ARM AUTO fix
on:
  push:
    branches: [agent/fix-continuous-arm-auto]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-continuous-arm-auto
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: node scripts/patch_continuous_arm_auto.js
      - name: Validate JavaScript patch markers
        run: |
          grep -q 'autoSession=false,rearmPending=false' index.html
          grep -q 'keepAuto=completedMode==="auto"' index.html
          grep -q 'version:"32.4"' version.js
          node --check scripts/patch_continuous_arm_auto.js
          node --check sw.js
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html version.js sw.js
          git commit -m 'MotoLab v32.4: keep ARM AUTO continuously armed'
          git push origin HEAD:agent/fix-continuous-arm-auto
