name: Validate MotoLab v34

on:
  push:
    branches: [v34-rebuild, main]
  pull_request:
    branches: [main]

jobs:
  validate-v34:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run v34 static and syntax checks
        run: node tests/v34_static_test.js
      - name: Validate server package entrypoint syntax
        working-directory: raw_sync_server
        run: node --check server.js && node --check beta_auth_server.js && node --check user_server.js && node --check user_features_server.js && node --check community_server.js && node --check feedback_server.js && node --check merit_server.js
