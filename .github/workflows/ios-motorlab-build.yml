name: MotorLab iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'ios/MotorLabAutoRide/**'
      - '.github/workflows/ios-motorlab-build.yml'
  pull_request:
    paths:
      - 'ios/MotorLabAutoRide/**'
      - '.github/workflows/ios-motorlab-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/MotorLabAutoRide
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build MotorLab for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project MotorLabAutoRide.xcodeproj \
            -scheme MotorLabAutoRide \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log

      - name: Verify iPhone Release archive without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project MotorLabAutoRide.xcodeproj \
            -scheme MotorLabAutoRide \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MotorLab.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive | tee xcodearchive.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motorlab-ios-build-logs
          path: |
            ios/MotorLabAutoRide/xcodebuild.log
            ios/MotorLabAutoRide/xcodearchive.log
          if-no-files-found: ignore
