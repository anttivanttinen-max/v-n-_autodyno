name: MotorLab iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'ios/MotorLabAutoRide/**'
      - '.github/workflows/ios-motorlab-build.yml'
  pull_request:
    paths:
      - 'ios/MotorLabAutoRide/**'
      - '.github/workflows/ios-motorlab-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/MotorLabAutoRide
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build MotorLab for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project MotorLabAutoRide.xcodeproj \
            -scheme MotorLabAutoRide \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log

      - name: Build unsigned iPhone Release app
        run: |
          set -o pipefail
          xcodebuild \
            -project MotorLabAutoRide.xcodeproj \
            -scheme MotorLabAutoRide \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MotorLabDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodearchive.log

      - name: Package unsigned IPA for sideloading
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/MotorLabDerivedData/Build/Products/Release-iphoneos/MotorLabAutoRide.app"
          test -d "$APP_PATH"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry MotorLabAutoRide-unsigned.ipa Payload
          /usr/bin/unzip -l MotorLabAutoRide-unsigned.ipa | head -40

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotorLabAutoRide-unsigned-ipa
          path: ${{ runner.temp }}/MotorLabAutoRide-unsigned.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motorlab-ios-build-logs
          path: |
            ios/MotorLabAutoRide/xcodebuild.log
            ios/MotorLabAutoRide/xcodearchive.log
          if-no-files-found: ignore
