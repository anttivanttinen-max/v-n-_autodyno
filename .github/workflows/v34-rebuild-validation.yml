name: V34 Rebuild Validation

on:
  push:
    branches: [dev/v34-rebuild]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax - app
        run: find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: JavaScript syntax - server and validation scripts
        run: |
          find raw_sync_server -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check scripts/validate_v34_rebuild.js
          node --check scripts/browser_smoke.js
      - name: Static rebuild validation x3
        run: |
          node scripts/validate_v34_rebuild.js
          node scripts/validate_v34_rebuild.js
          node scripts/validate_v34_rebuild.js
      - name: Identity and server integration x3
        run: |
          node raw_sync_server/test_identity_flow.js
          node raw_sync_server/test_identity_flow.js
          node raw_sync_server/test_identity_flow.js
      - name: Measurement invariant markers
        run: |
          grep -q "GPS MASTER" gps_master_learning.js
          grep -q "trip-gear" trip_gear_guard.js
          grep -q "rpm-learning" adaptive_rpm_learning.js
          grep -q "phone" phone_rpm_smart.js
          ! grep -q "camera" v34_dashboard_ui.js
      - name: Install Chromium smoke-test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/motolab-http.log 2>&1 &
          echo $! > /tmp/motolab-http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 0.2; done
          cat /tmp/motolab-http.log
          exit 1
      - name: Browser + Service Worker smoke x2
        env:
          MOTOLAB_SMOKE_URL: http://127.0.0.1:8080/
        run: |
          node scripts/browser_smoke.js
          node scripts/browser_smoke.js
      - name: Publish successful validation status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"success","context":"v34-rebuild-validation","description":"V34 rebuild validation passed","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
      - name: Publish failed validation status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"failure","context":"v34-rebuild-validation","description":"V34 rebuild validation failed","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
